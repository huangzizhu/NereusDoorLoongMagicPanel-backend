[project]
name = "nereusdoorloongmagicpanel-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "openai>=1.86.0",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.14.0",
    "psutil>=7.2.2",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "websockets>=15.0.1",
    "tavily-python>=0.7.25",
    "cryptography>=49.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[tool.ndlmpanel-agent]
tavily_api_key = "tvly-YOUR_API_KEY_HERE"

[tool.ndlmpanel-agent.mcp-servers.ndlmpanel-mcp]
command = ["python", "-m", "ndlmpanel_agent.mcp"]

[tool.ndlmpanel-agent.mcp-servers.agent-core-mcp]
command = ["python", "-m", "agent.agent_mcp"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]
